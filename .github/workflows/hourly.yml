name: Hourly election data refresh

# STOPPED 2026-11-11 at the owner's request: no timer, and the job below never runs, so the public site keeps its last
# update. To restart, restore the triggers from git history and delete the "if: false" line.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

env:
  # "live": data/ on main (the public site) is updated. Run requests (push) are always "dry-run".
  PUBLISH: ${{ github.event_name == 'push' && 'dry-run' || 'live' }}

jobs:
  refresh:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and spreadsheet readers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pip install -q openpyxl
      - name: Restore the previous run's state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ env.PUBLISH }}-${{ github.run_id }}
          restore-keys: state-${{ env.PUBLISH }}-
      - name: Run the hourly refresh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/run_hourly.py
      - name: Save state for the next run
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ env.PUBLISH }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep this run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            .work/out/archive-*.json
            .work/out/log.json
            .work/direct_obs.json
          retention-days: 90
          if-no-files-found: ignore
